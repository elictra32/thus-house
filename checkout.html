<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07050d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <title>ชำระเงิน — Thushouse Academy</title>
</head>
<body>
  <div id="site-header"></div>
  <main class="container page">
    <a class="back" href="index.html#courses">← เลือกคอร์สอื่น</a>
    <h1>ชำระเงินและแนบสลิป</h1>
    <div class="checkout">
      <form class="glass form-card" id="form">
        <h3 style="margin-top:0">1. ข้อมูลผู้เรียน</h3>
        <div class="field"><label for="name">ชื่อ–นามสกุล</label><input id="name" required /></div>
        <div class="field"><label for="email">อีเมล (ใช้เข้าสู่ระบบ)</label><input id="email" type="email" required /></div>
        <div class="field"><label for="tel">เบอร์โทร / LINE ID</label><input id="tel" required /></div>
        <h3>2. โอนเงิน</h3>
        <div class="bank" id="bank"></div>
        <h3>3. แนบสลิป</h3>
        <div class="field"><input id="slip" type="file" accept="image/*" required /></div>
        <button class="btn btn-primary btn-lg btn-block">ยืนยันการชำระเงิน</button>
        <div class="notice" id="notice">✅ ได้รับข้อมูลแล้ว ทีมงานจะตรวจสอบและเปิดสิทธิ์การเรียนให้ภายในเวลาทำการ (หน้าตัวอย่าง — ยังไม่ได้เชื่อมระบบหลังบ้าน)</div>
      </form>
      <aside class="glass form-card">
        <h3 style="margin-top:0">สรุปคำสั่งซื้อ</h3>
        <div id="summary"></div>
        <div class="field" style="margin-top:18px">
          <label for="code">โค้ดส่วนลด</label>
          <div style="display:flex;gap:8px"><input id="code" placeholder="เช่น THUS10" /><button type="button" class="btn btn-ghost" id="apply">ใช้</button></div>
          <p class="small" id="code-msg" style="margin:6px 0 0"></p>
        </div>
      </aside>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/courses.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    const item = findItem(new URLSearchParams(location.search).get("id")) || COURSES[0];
    let pct = 0;
    const $ = (id) => document.getElementById(id);

    function render() {
      const discount = Math.round((item.price * pct) / 100);
      const total = item.price - discount;
      $("summary").innerHTML = `
        <div class="summary-row"><span>${item.title}</span><span class="nums">${baht(item.price)}</span></div>
        ${pct ? `<div class="summary-row emerald"><span>ส่วนลด ${pct}%</span><span class="nums">−${baht(discount)}</span></div>` : ""}
        <div class="summary-row total"><span>ยอดชำระ</span><span class="nums">${baht(total)}</span></div>`;
      $("bank").innerHTML = `โอนยอด <b class="nums">${baht(total)}</b> มาที่<br />
        ${SITE.bank.name} · เลขที่ <b>${SITE.bank.account}</b><br />ชื่อบัญชี <b>${SITE.bank.owner}</b>`;
    }
    function applyCode(code) {
      code = code.trim().toUpperCase();
      if (COUPONS[code]) { pct = COUPONS[code]; $("code-msg").innerHTML = '<span class="emerald">ใช้โค้ดสำเร็จ</span>'; }
      else { pct = 0; $("code-msg").innerHTML = '<span style="color:#f87171">โค้ดไม่ถูกต้อง</span>'; }
      render();
    }
    $("apply").onclick = () => applyCode($("code").value);
    const saved = store.get("th_coupon");
    if (saved) { $("code").value = saved; applyCode(saved); }
    $("form").onsubmit = (e) => { e.preventDefault(); $("notice").style.display = "block"; };
    render();
  </script>
</body>
</html>
