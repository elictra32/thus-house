<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07050d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <title>เข้าสู่ระบบ — Thushouse Academy</title>
</head>
<body>
  <div id="site-header"></div>
  <main class="auth">
    <form class="glass form-card" id="form">
      <h1 id="title">เข้าสู่ระบบ</h1>
      <p class="muted" id="subtitle" style="margin:0 0 24px">ยินดีต้อนรับกลับบ้าน Thushouse</p>
      <div class="field" id="name-field" hidden><label for="name">ชื่อ–นามสกุล</label><input id="name" /></div>
      <div class="field"><label for="email">อีเมล</label><input id="email" type="email" required /></div>
      <div class="field"><label for="password">รหัสผ่าน</label><input id="password" type="password" minlength="6" required /></div>
      <button class="btn btn-primary btn-lg btn-block" id="submit">เข้าสู่ระบบ</button>
      <div class="notice" id="notice"></div>
      <p class="switch" id="switch"></p>
    </form>
  </main>
  <div id="site-footer"></div>
  <script src="assets/courses.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    // หน้าตัวอย่าง — ยังไม่ได้เชื่อมระบบสมาชิกจริง
    let register = location.hash === "#register";
    const $ = (id) => document.getElementById(id);
    function render() {
      $("title").textContent = register ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
      $("subtitle").textContent = register ? "สร้างบัญชีเพื่อเริ่มเรียน" : "ยินดีต้อนรับกลับบ้าน Thushouse";
      $("submit").textContent = register ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
      $("name-field").hidden = !register;
      $("name").required = register;
      $("notice").style.display = "none";
      $("switch").innerHTML = register
        ? 'มีบัญชีแล้ว? <a href="#" id="toggle">เข้าสู่ระบบ</a>'
        : 'ยังไม่มีบัญชี? <a href="#register" id="toggle">สมัครสมาชิก</a>';
      $("toggle").onclick = (e) => { e.preventDefault(); register = !register; render(); };
    }
    $("form").onsubmit = (e) => {
      e.preventDefault();
      $("notice").textContent = (register ? "สมัครสมาชิก" : "เข้าสู่ระบบ") + "สำเร็จ (ตัวอย่าง)";
      $("notice").style.display = "block";
    };
    render();
  </script>
</body>
</html>
